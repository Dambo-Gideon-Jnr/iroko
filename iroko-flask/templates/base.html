<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Iroko{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Sora:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <header class="nav">
    <a class="brand" href="{{ url_for('home') }}">Iroko</a>
    <nav>
      <a href="{{ url_for('home') }}">Search</a>
      <a href="{{ url_for('destinations') }}">Destinations</a>
      <a href="{{ url_for('trips') }}">My trips</a>
    </nav>
  </header>
  <main>{% block body %}{% endblock %}</main>
  <footer>
    <p>Iroko — domestic travel across Nigeria. Prices in naira.</p>
    <p>Demo bookings. No payment is taken.</p>
  </footer>
</body>
</html>
